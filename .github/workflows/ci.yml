name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier Check
        run: npm run format:check
        continue-on-error: false

      - name: ESLint Check
        run: npm run lint
        continue-on-error: false

      - name: TypeScript Compilation
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Upload test coverage
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage
          path: coverage/
          retention-days: 7

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build
        run: npm run clean

      - name: Build project
        run: npm run build

      - name: Check dist folder
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist folder not created"
            exit 1
          fi
          for f in dist/cjs/index.js dist/cjs/index.d.ts dist/cjs/package.json \
                   dist/esm/index.js dist/esm/index.d.ts dist/esm/package.json; do
            if [ ! -f "$f" ]; then
              echo "Error: $f not found"
              exit 1
            fi
          done
          echo "✓ Build artifacts verified"

  test-coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Display coverage summary
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.txt 2>/dev/null || echo "Coverage report not available" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  examples-check:
    name: Verify Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Test basic validation example
        run: node docs/examples/basic-validation.js

      - name: Test parsing information example
        run: node docs/examples/parsing-information.js

      - name: Test batch validation example
        run: node docs/examples/batch-validation.js

      - name: Test real-world integration example
        run: node docs/examples/real-world-integration.js

      - name: Test forms integration example
        run: node docs/examples/forms-integration.js

      - name: Test TypeScript usage examples
        run: |
          npm run example
          npm run example:extended

  package-check:
    name: Package Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Lint packed package (publint + attw)
        run: npm run lint:package

      - name: Check published declarations for any
        run: npm run lint:types

      - name: Smoke-test packed package
        run: npm run test:pack

      - name: Check bundle-size budgets
        run: npm run size

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality-checks, build-check, test-coverage, examples-check, package-check]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.quality-checks.result }}" != "success" ]; then
            echo "❌ Quality checks failed"
            exit 1
          fi
          if [ "${{ needs.build-check.result }}" != "success" ]; then
            echo "❌ Build verification failed"
            exit 1
          fi
          if [ "${{ needs.test-coverage.result }}" != "success" ]; then
            echo "❌ Test coverage failed"
            exit 1
          fi
          if [ "${{ needs.examples-check.result }}" != "success" ]; then
            echo "❌ Examples verification failed"
            exit 1
          fi
          if [ "${{ needs.package-check.result }}" != "success" ]; then
            echo "❌ Package verification failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
