name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify package name
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if [ "$PACKAGE_NAME" != "idnumbers" ]; then
            echo "Error: Package name must be 'idnumbers', found '$PACKAGE_NAME'"
            exit 1
          fi
          echo "✓ Package name verified: idnumbers"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript compilation
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist folder not created"
            exit 1
          fi
          for f in dist/cjs/index.js dist/cjs/index.d.ts dist/cjs/package.json \
                   dist/esm/index.js dist/esm/index.d.ts dist/esm/package.json; do
            if [ ! -f "$f" ]; then
              echo "Error: $f not found"
              exit 1
            fi
          done
          echo "✓ Build artifacts verified"

      - name: Validate package exports and types
        run: npm run lint:package

      - name: Check published declarations for any
        run: npm run lint:types

      - name: Smoke-test packed package
        run: npm run test:pack

      - name: Check bundle-size budgets
        run: npm run size

      - name: Check if version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Package version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "✓ Version matches tag: v$PACKAGE_VERSION"

      # Trusted publishing (#193) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      # npm first tries trusted publishing: it exchanges this job's OIDC token
      # (id-token: write) for a short-lived publish token, which works once
      # npmjs.com lists this repository and workflow as a trusted publisher.
      # Otherwise it falls back to NODE_AUTH_TOKEN. Delete the NPM_TOKEN
      # secret, and this env entry, once trusted publishing is configured.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Success
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "🎉 Successfully published idnumbers@$PACKAGE_VERSION to npm!"
          echo "📦 View at: https://www.npmjs.com/package/idnumbers/v/$PACKAGE_VERSION"